  :root{
    /* palette from the brief: calm (green-black) → squeezed (orange) → complete (green) */
    --bg:#071c03;--fg:#e2e9dc;--dim:color-mix(in srgb,var(--fg) 60%,transparent);--line:color-mix(in srgb,var(--fg) 35%,transparent);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --word:"BenchNine","Arial Narrow","Helvetica Neue",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
  body{margin:0;font-family:var(--mono)}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;color:var(--fg)}
  #scene text{font-family:var(--word);font-weight:300;text-rendering:geometricPrecision}
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;
    padding:0 16px calc(22px + env(safe-area-inset-bottom,0px));
    font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .seg button{border:0;background:none;color:var(--dim);padding:6px 10px}
  .seg button[aria-pressed="true"]{background:none;color:var(--fg)}
  .seg button:hover{color:var(--fg)}
  button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--fg);background:transparent;
    border:1px solid var(--line);padding:8px 12px;border-radius:0;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--fg)}
  button:disabled{opacity:.35;cursor:default}
  button:focus-visible,input:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
  [hidden]{display:none!important}
  .seg{display:flex}
  .slider{display:flex;align-items:center;gap:10px;color:var(--dim)}
  .slider output{color:var(--fg);font-variant-numeric:tabular-nums;min-width:4ch}
  input[type=range]{-webkit-appearance:none;appearance:none;width:min(220px,38vw);height:24px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:18px;background:var(--fg);border:0;border-radius:0;margin-top:-8.5px}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:8px;height:18px;background:var(--fg);border:0;border-radius:0}
  input[type=range]:disabled{opacity:.35;cursor:default}
  .status{color:var(--dim);min-width:11ch;font-variant-numeric:tabular-nums}
</style>

<svg id="scene" role="img" aria-label="Progress indicator: a figure pushes the word LOADING until it is squeezed small, then it springs open into COMPLETE!">
  <g id="word" fill="currentColor"></g>
  <path id="lb" fill="none" stroke="currentColor" stroke-linejoin="miter" visibility="hidden"></path>
  <path id="rb" fill="none" stroke="currentColor" stroke-linejoin="miter" visibility="hidden"></path>
  <line id="floor" visibility="hidden" stroke="currentColor" stroke-linecap="round"></line>
  <g id="fig" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="legA"></path>
    <path id="legB"></path>
    <path id="torso"></path>
    <path id="armA"></path>
    <path id="armB"></path>
    <circle id="head"></circle>
  </g>
  <g id="fx" stroke="currentColor" fill="none" stroke-linecap="round">
    <path id="trail"></path><path id="confetti" stroke-linejoin="round"></path><path id="strain"></path><path id="motion"></path><path id="dust"></path>
  </g>
</svg>

<div class="bar" id="bar">
  <button id="replay" type="button" hidden>Replay</button>
  <div class="seg" role="group" aria-label="Mode">
    <button id="mDet" type="button" aria-pressed="true">Determinate</button>
    <button id="mInd" type="button" aria-pressed="false">Indeterminate</button>
  </div>
  <label class="slider" id="sliderWrap" for="prog" hidden>Progress
    <input id="prog" type="range" min="0" max="100" step="1" value="0">
    <output id="progOut" for="prog">000%</output>
  </label>
  <button id="complete" type="button" hidden>Complete</button>
  <span class="status" id="status" hidden>Ready</span>
</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg=$('scene'), wordG=$('word'), lb=$('lb'), rb=$('rb'), figG=$('fig');
const torso=$('torso'), legA=$('legA'), legB=$('legB'), armA=$('armA'), armB=$('armB'), head=$('head');
const bar=$('bar'), btnReplay=$('replay'), btnDet=$('mDet'), btnInd=$('mInd');
const range=$('prog'), out=$('progOut'), sliderWrap=$('sliderWrap'), btnDone=$('complete'), statusEl=$('status');
const FONT = '"BenchNine", "Arial Narrow", sans-serif', WEIGHT=300;
const floorEl=document.getElementById('floor');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const ctx = document.createElement('canvas').getContext('2d');

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const rand=(a,b)=>a+Math.random()*(b-a);
const noise=(t,k)=>Math.sin(t*41.3+k*1.7)*.5+Math.sin(t*67.9+k*3.1)*.3+Math.sin(t*103.1+k*5.3)*.2;
const f2=p=>p[0].toFixed(2)+' '+p[1].toFixed(2);

/* ---------- layout ---------- */
let Ly={};
function measure(){
  const vw=innerWidth, vh=innerHeight, avail=vh;
  ctx.font=`${WEIGHT} 100px ${FONT}`;
  const m=ch=>ctx.measureText(ch);
  const cap100=m('H').actualBoundingBoxAscent||80;
  const wOf=w=>[...w].map(ch=>m(ch).width);
  const wl=wOf('LOADING'), avg=wl.reduce((a,b)=>a+b)/wl.length;
  // brackets are drawn as hairline paths (same weight as the figure), not font glyphs
  const lbAbl=0, rbAbl=0, lbW=0, rbW=0;   // no brackets: the word itself is the object
  const track=avg*0.62, pad=avg*0.9;
  const compL=lbW+0.35*pad+wl.reduce((a,b)=>a+b)+6*track+rbW;
  const wc=wOf('COMPLETE!'), compC=lbW+0.35*pad+wc.reduce((a,b)=>a+b)+(wc.length-1)*track+rbW;
  const ext=1.5*avg;   // the line runs one and a half letters past the word on each side
  const rp=0.35*pad, textL=compL-rp, textC=compC-rp;
  const line100=2*ext+(textL+textC)/2;
  // the word sits small in the middle of the screen, leaving room for the throw
  const target=vw<700?vw*0.84:vw*0.5;
  const F=Math.max(14,Math.min(100*target/line100, 100*avail*0.2/cap100));
  const k=F/100, capH=cap100*k;
  const origin=vw/2-(textL+textC)/4*k, lineL=origin-ext*k;
  const base=avail/2+capH/2, stroke=Math.max(1.2,capH*0.045), lineY=base+stroke*0.5;   // no visible line: the figure stands on the baseline
  Ly={vw,vh,F,capH,adv:avg*k,track:track*k,pad:pad*k,
    wid:{LOADING:wl.map(w=>w*k),'COMPLETE!':wOf('COMPLETE!').map(w=>w*k)},
    lbAbl:lbAbl*k,lbW:lbW*k,rbAbl:rbAbl*k,rbW:rbW*k,
    origin,lineL,lineR:origin+(textL+1.8*ext)*k,ext:ext*k,rp:rp*k,lineY,base,ground:lineY-stroke/2,
    restX:origin+compL*k+1.35*capH,
    u:capH*0.95/98,stroke};
  svg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);
  wordG.setAttribute('font-size',F.toFixed(2));
  [lb,rb].forEach(el=>el.setAttribute('stroke-width',stroke.toFixed(2)));
  figG.setAttribute('stroke-width',stroke.toFixed(2));
  floorEl.setAttribute('stroke-width',stroke.toFixed(2));
  floorEl.setAttribute('x1',Ly.lineL.toFixed(2));
  floorEl.setAttribute('y1',lineY.toFixed(2)); floorEl.setAttribute('y2',lineY.toFixed(2));
}

/* The word is a chain of springs, left-anchored. Right-hand springs are softer,
   so the right pad collapses first, then tracking, then glyphs — right to left. */
function chain(word){
  const {adv,track,pad}=Ly, W=Ly.wid[word], n=W.length, els=[];
  els.push({kind:'pad',rest:0,min:0,k:40});
  for(let i=0;i<n;i++){
    // every letter stays: they all get squeezed together (right side a little softer), gaps close up and overlap slightly
    const r=n>1?i/(n-1):0, f=Math.pow(1+1.2*(1-r),2);
    els.push({kind:'g',rest:W[i],min:W[i]*0.3,k:2.2*f*adv/W[i]});
    if(i<n-1){const r2=(i+0.5)/(n-1), g=Math.pow(1+1.2*(1-r2),2); els.push({kind:'gap',rest:track,min:-0.12*adv,k:0.8*g});}
  }
  els.push({kind:'pad',rest:pad*0.35,min:adv*0.06,k:0.6});
  els.rest=els.reduce((s,e)=>s+e.rest,0);
  els.min=els.reduce((s,e)=>s+e.min,0);
  return els;
}
function solve(els,S){
  if(S>=els.rest){
    const extra=S-els.rest; let flex=0;
    for(const e of els) if(e.kind!=='g') flex+=e.rest;
    for(const e of els) e.len=e.rest+(e.kind!=='g'?extra*e.rest/flex:0);
    return;
  }
  if(S<=els.min){for(const e of els) e.len=e.min*S/els.min; return;}
  let lo=0,hi=0; for(const e of els) hi=Math.max(hi,(e.rest-e.min)*e.k);
  for(let it=0;it<36;it++){
    const P=(lo+hi)/2; let tot=0;
    for(const e of els) tot+=Math.max(e.min,e.rest-P/e.k);
    if(tot>S) lo=P; else hi=P;
  }
  let tot=0; for(const e of els){e.len=Math.max(e.min,e.rest-hi/e.k); tot+=e.len;}
  els[els.length-1].len+=S-tot;
}
const originFor=()=>Ly.origin;

/* ---------- state ---------- */
const S={mode:'det',phase:'rest',pt:0,c:0,cv:0,ct:0,omega:10,zeta:1,word:'LOADING',chain:null,
  prog:0,auto:true,gen:{seg:0,rate:0},ind:{sub:'push',st:0,dur:2,from:0,peak:.6,low:.15},
  fade:1,originFrom:0,originTo:0,vPeak:0,J:0,completeReq:false};
const fig={mode:'stand',hipX:0,lean:.04,effort:0,phase:0,x:0,y:0,vx:0,vy:0,rot:0,vr:0,t:0,
  squash:0,walkSpeed:60,prevContact:null,P:null,fromP:null,bl:1,blDur:.3,x0:0,y0:0,tf:.8,g:0,rot0:0,rotEnd:0,hx:0,vs:0,adv:0,feet:[[0,0],[0,0]],swing:null,trail:[],trailA:0};
let letters=[], T=0;

function setWord(w){
  S.word=w; wordG.textContent='';
  letters=[...w].map(ch=>{const t=document.createElementNS(NS,'text'); t.textContent=ch; wordG.appendChild(t); return t;});
  S.chain=chain(w);
}
const go=p=>{S.phase=p;S.pt=0;};
const spring=(w,z)=>{S.omega=w;S.zeta=z;};
const setSub=(n,d)=>{S.ind.sub=n;S.ind.st=0;S.ind.dur=d;};

function geom(){
  const els=S.chain, c=S.c;
  solve(els, els.min+(els.rest-els.min)*(1-c));
  const ox = S.phase==='release' ? S.originTo+(S.originFrom-S.originTo)*clamp(c,-.4,1) : originFor(els);
  let x=ox+Ly.lbW; const L=[];
  for(const e of els){ if(e.kind==='g') L.push({x,s:e.len/e.rest}); x+=e.len; }
  return {ox,letters:L,rbL:x,rbR:x+Ly.rbW,rbx:0};
}
const restHipX=()=>Ly.lineR-0.3*Ly.capH;
const pushHipX=(cx,lean,e)=>cx+(36-3*e)*Ly.u+TORSO*Ly.u*(1-0.05*e)*Math.sin(lean);

/* ---------- figure: matches the motion reference — big round head sitting right on a short torso,
   thin limbs. Units of u; standing height 96u ---------- */
const HR=11, NECK=0, TORSO=30, THIGH=23, SHIN=23, UARM=20, FARM=18;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function ik(a,b,l1,l2,sign){
  let dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy);
  if(d<1e-6){dx=0;dy=1;d=1e-6;}
  const dd=clamp(d,Math.abs(l1-l2)+1e-3,(l1+l2)*0.999), nx=dx/d, ny=dy/d;
  const A=(l1*l1-l2*l2+dd*dd)/(2*dd), h=Math.sqrt(Math.max(0,l1*l1-A*A));
  return [[a[0]+A*nx-sign*h*ny, a[1]+A*ny+sign*h*nx],[a[0]+nx*dd,a[1]+ny*dd]];
}
/* forward kinematics; positive angle = swung forward (to the left, direction of travel) */
function legFK(hip,a,flex){const u=Ly.u;
  const k=[hip[0]-Math.sin(a)*THIGH*u, hip[1]+Math.cos(a)*THIGH*u];
  return [k,[k[0]-Math.sin(a-flex)*SHIN*u, k[1]+Math.cos(a-flex)*SHIN*u]];}
function armFK(sh,a,bend){const u=Ly.u;
  const e=[sh[0]-Math.sin(a)*UARM*u, sh[1]+Math.cos(a)*UARM*u];
  return [e,[e[0]-Math.sin(a+bend)*FARM*u, e[1]+Math.cos(a+bend)*FARM*u]];}
function upper(hip,lean,bend,T){
  const u=Ly.u,s=Math.sin(lean),c=Math.cos(lean),hr=HR*u;
  const sh=[hip[0]-T*s,hip[1]-T*c];
  return {hip,sh,hr,neck:sh,
    head:[sh[0]-s*hr, sh[1]-c*hr],
    mid:[(hip[0]+sh[0])/2+c*bend,(hip[1]+sh[1])/2-s*bend]};
}
/* 01 Walk / 02 Stop: walking=false is the standing pose; squash = landing/crouch 0..1 */
function poseStand(hipX,lean,phase,walking,squash){
  const u=Ly.u, x=2*Math.PI*phase, legs=[], arms=[];
  for(let k=0;k<2;k++){
    const xk=x+k*Math.PI;
    if(walking){
      const a=0.46*Math.sin(xk), flex=0.04+0.5*Math.pow(Math.max(0,Math.cos(xk)),1.6);
      legs.push([a,flex]);
      arms.push([-0.28*Math.sin(xk)+(k?-0.22:0.24), 0.12+0.15*Math.max(0,-Math.sin(xk))]);
    } else {
      legs.push([(k?-0.1:0.1)+0.4*squash, 0.02+0.8*squash]);
      arms.push([(k?-0.3:0.32)+0.25*squash, (k?-0.1:0.12)+0.3*squash]);
    }
  }
  let low=0; legs.map(([a,f])=>legFK([0,0],a,f)).forEach(l=>low=Math.max(low,l[1][1]));
  const hip=[hipX,Ly.ground-low];
  const P=upper(hip,lean+(walking?0.03*Math.sin(2*x):0)+0.12*squash,(walking?0.4+0.3*Math.sin(2*x):0.6)*u+squash*2*u,TORSO*u*(1-0.06*squash));
  P.legs=legs.map(([a,f])=>legFK(hip,a,f));
  P.arms=arms.map(([a,b])=>armFK(P.sh,a,b));
  return P;
}
/* 03–05 Contact / Lean in / Apply force (motion reference): torso on a diagonal, arms straight out to
   the bracket, a lunge — front knee bent toward the bracket, back leg long and straight behind.
   Feet stay planted; the back foot only steps forward when the leg can't stretch any further. */
const pushBack=lean=>(THIGH+SHIN)*Ly.u*0.7;
function pushFrame(cx,lean,e){
  const u=Ly.u,Lg=(THIGH+SHIN)*u;
  const T=TORSO*u*(1-0.05*e), shX=cx+(36-3*e)*u, hipX=shX+T*Math.sin(lean);
  const h=Lg*(0.86-0.22*e);
  return {u,Lg,T,hipX,hipY:Ly.ground-h,reach:Math.sqrt(Math.max(0,Math.pow(0.985*Lg,2)-h*h))};
}
function posePush(cx,lean,e,feet){
  const u=Ly.u, fr=pushFrame(cx,lean,e), hip=[fr.hipX,fr.hipY];
  const P=upper(hip,lean,e*1.2*u,fr.T);
  P.legs=feet.map(f=>ik(hip,f,THIGH*u,SHIN*u,1));
  P.arms=[[cx,P.sh[1]+1*u],[cx,P.sh[1]+3*u]].map(h=>ik(P.sh,h,UARM*u,FARM*u,-1));
  return P;
}
function stepFeet(dt,cx){
  const u=Ly.u, fr=pushFrame(cx,fig.lean,fig.effort), F=fig.feet, g=Ly.ground;
  const frontX=fr.hipX-20*u;
  if(fig.swing){
    const sw=fig.swing; sw.t=Math.min(1,sw.t+dt/0.55);
    const k=ease(sw.t);
    F[sw.i]=[sw.from+(frontX-sw.from)*k, g-6*u*Math.sin(Math.PI*sw.t)];
    if(sw.t>=1){F[sw.i][1]=g; fig.swing=null;}
  }
  for(let i=0;i<2;i++){
    if(fig.swing&&fig.swing.i===i) continue;
    // a planted foot can't be further than a straight leg allows: it drags
    if(F[i][0]>fr.hipX+fr.reach) F[i][0]=fr.hipX+fr.reach;
    if(F[i][0]<fr.hipX-26*u) F[i][0]=fr.hipX-26*u;
    F[i][1]=g;
  }
  // when the back leg is fully stretched and the body is still going forward, bring it through
  if(!fig.swing){
    const bi=F[0][0]>F[1][0]?0:1;
    if(F[bi][0]>=fr.hipX+fr.reach-0.5*u && fig.adv>0.08) fig.swing={i:bi,t:0,from:F[bi][0]};
  }
}

/* 08 Release, 09–10 tucked tumble, 12 lying: built upright around the hip, then rotated */
function poseLocal(kind,t){
  const u=Ly.u, T=TORSO*u, fl=Math.sin(t*14), P=upper([0,0],0,0,T);
  if(kind==='recoil'){      // 09–10: knocked backwards, arms flung forward, feet stumbling
    P.legs=[legFK([0,0],0.45+0.1*fl,0.7),legFK([0,0],-0.25,0.15)];
    P.arms=[armFK(P.sh,1.35+0.1*fl,0.35),armFK(P.sh,1.05-0.1*fl,0.45)];
  } else if(kind==='fall'){ // 11: losing balance, body straight, arms reaching forward-up
    P.legs=[legFK([0,0],0.35,0.5),legFK([0,0],-0.05,0.1)];
    P.arms=[armFK(P.sh,2.1+0.15*fl,0.3),armFK(P.sh,1.8-0.15*fl,0.4)];
  } else if(kind==='tuck'){ // balled up, knees to chest, arms round the shins
    P.legs=[legFK([0,0],1.95,2.55),legFK([0,0],1.8,2.45)];
    P.arms=[armFK(P.sh,1.35,1.05),armFK(P.sh,1.15,1.2)];
  } else {                  // lying on its side: limbs rest toward local +x (the ground once rotated)
    P.legs=[ik([0,0],[13*u,44*u],THIGH*u,SHIN*u,-1),ik([0,0],[12*u,38*u],THIGH*u,SHIN*u,1)];
    P.arms=[ik(P.sh,[12*u,P.sh[1]+18*u],UARM*u,FARM*u,-1),ik(P.sh,[11*u,P.sh[1]+8*u],UARM*u,FARM*u,-1)];
  }
  return P;
}
function localMix(k1,k2,w,t){return w<=0?poseLocal(k1,t):w>=1?poseLocal(k2,t):lerpP(poseLocal(k1,t),poseLocal(k2,t),ease(w));}
function place(P,x,y,rot){
  const cs=Math.cos(rot),sn=Math.sin(rot), m=p=>[x+p[0]*cs-p[1]*sn, y+p[0]*sn+p[1]*cs];
  return {hip:m(P.hip),sh:m(P.sh),hr:P.hr,neck:m(P.neck),head:m(P.head),mid:m(P.mid),
    legs:P.legs.map(l=>[m(l[0]),m(l[1])]),arms:P.arms.map(a=>[m(a[0]),m(a[1])])};
}
const lieY=()=>Ly.ground-HR*Ly.u-Ly.stroke*0.5;
function lerpP(A,B,t){
  const l=(a,b)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  return {hip:l(A.hip,B.hip),sh:l(A.sh,B.sh),hr:B.hr,neck:l(A.neck,B.neck),head:l(A.head,B.head),mid:l(A.mid,B.mid),
    legs:B.legs.map((q,i)=>[l(A.legs[i][0],q[0]),l(A.legs[i][1],q[1])]),
    arms:B.arms.map((q,i)=>[l(A.arms[i][0],q[0]),l(A.arms[i][1],q[1])])};
}
function blendFrom(dur){ if(fig.P){fig.fromP=fig.P; fig.bl=0; fig.blDur=dur;} }
/* straight segments with a real corner at the knee / elbow, as in the reference */
function limb(a,j,b){ return `M${f2(a)} L${f2(j)} L${f2(b)}`; }
function drawFig(P){
  torso.setAttribute('d',`M${f2(P.hip)} L${f2(P.neck)}`);
  legA.setAttribute('d',limb(P.hip,P.legs[0][0],P.legs[0][1]));
  legB.setAttribute('d',limb(P.hip,P.legs[1][0],P.legs[1][1]));
  armA.setAttribute('d',limb(P.sh,P.arms[0][0],P.arms[0][1]));
  armB.setAttribute('d',limb(P.sh,P.arms[1][0],P.arms[1][1]));
  head.setAttribute('cx',P.head[0].toFixed(2)); head.setAttribute('cy',P.head[1].toFixed(2)); head.setAttribute('r',P.hr.toFixed(2));
}

/* ---------- phases ---------- */
function initRun(){
  if(S.mode==='det'){S.gen.seg=0;}
  else {S.ind={sub:'push',st:0,dur:rand(1.5,2.3),from:S.c,peak:rand(.4,.78),low:.15,hold:0,lastEp:'',pendingFinal:false};}
}
function startApproach(){
  const G=geom(); const target=pushHipX(G.rbR+Ly.stroke*0.6,0.08,0);
  fig.mode='walk'; fig.walkSpeed=Math.max(Ly.capH*0.45,(fig.hipX-target)/3.4);
  go('approach');
}
function release(){
  S.originFrom=originFor(S.chain);
  setWord('COMPLETE!');
  S.originTo=originFor(S.chain);
  S.c=1; S.cv=0; S.vPeak=0;
  go('release'); spring(RM.matches?10:14, RM.matches?1:0.42);
}
/* thrown up and away at ~60°, fast enough to clear the word as it springs open, and out of frame */
/* the throw: one smooth motion — a quick rise up and to the right that levels into a glide,
   with a single somersault eased in and out near the top, then out through the right edge */
function launch(){
  const P=fig.P, c=Ly.capH;
  fig.x0=P.hip[0]; fig.y0=P.hip[1]; fig.x=fig.x0; fig.y=fig.y0;
  fig.vx=c*7; fig.H=c*1.7;
  fig.rot0=-fig.lean; fig.t=0; fig.g=0; fig.vy=0;
  blendFrom(0.12); fig.trail=[];
  fig.mode=RM.matches?'gone':'fly'; if(RM.matches) fig.P=null;
}
function runDet(dt){
  if(S.auto){
    const g=S.gen; g.seg-=dt;
    if(g.seg<=0){const r=Math.random(); g.rate=r<.16?0:r<.42?7:r<.8?16:30; g.seg=rand(.25,.8);}
    S.prog=Math.min(100,S.prog+g.rate*dt); syncSlider();
  }
  S.ct=S.prog>=100?1:Math.min(0.992,S.prog/100); spring(9,1);
  if(S.prog>=100) go('final');
}
/* ---------- indeterminate: the figure doesn't just push-and-slip, it takes different kinds of breaks ---------- */
const EPIS=['slip','backrest','rest','wipe','charge'];
function pickEpisode(){let e,n=0; do{e=EPIS[Math.floor(Math.random()*EPIS.length)];}while(e===S.ind.lastEp&&++n<6); S.ind.lastEp=e; return e;}
function edgeAt(c){const els=S.chain; solve(els,els.min+(els.rest-els.min)*(1-c)); let x=originFor()+Ly.lbW; for(const e of els) x+=e.len; return x+Ly.rbW+Ly.stroke*0.6;}
function enterPush(cx){
  const u=Ly.u; blendFrom(0.35);
  const fr=pushFrame(cx,0.45,0.1); fig.feet=[[fr.hipX-20*u,Ly.ground],[fr.hipX+fr.reach*0.92,Ly.ground]];
  fig.swing=null; fig.mode='push'; fig.effort=0.3; fig.prevContact=cx; fig.act=null;
}
function startEpisode(ep){
  const I=S.ind, u=Ly.u, c=Ly.capH;
  I.hold=S.c;
  if(ep==='slip'){I.low=rand(.1,.24); setSub('slip',.8); return;}
  blendFrom(0.4);
  fig.act={kind:ep,t:0,x0:fig.P?fig.P.hip[0]:fig.hipX}; fig.mode='act';
  if(ep==='backrest') setSub('backrest',rand(2.4,3.2));
  else if(ep==='rest'){I.low=rand(.05,.15); fig.act.x1=edgeAt(I.low)+1.3*c; setSub('rest',rand(3.2,3.8));}
  else if(ep==='wipe'){I.low=S.c*0.8; fig.act.x1=edgeAt(I.low)+16*u; setSub('wipe',2);}
  else if(ep==='charge'){I.low=rand(.12,.22); fig.act.x1=edgeAt(I.low)+2.6*c; setSub('charge',99);}
}
function resumePush(){ // walk back to the word and get going again
  const x=fig.P?fig.P.hip[0]:fig.hipX;
  blendFrom(0.3); fig.mode='walk'; fig.resume=true; fig.hipX=x; fig.lean=0.08; fig.walkSpeed=Ly.capH*0.9; fig.act=null;
}
function nextPush(){const I=S.ind; I.from=S.c; I.peak=Math.min(.88,Math.max(S.c+0.12,rand(.3,.85))); setSub('push',rand(1.4,2.2));}
function runInd(dt){
  const I=S.ind; I.st+=dt;
  if(S.completeReq){
    S.completeReq=false;
    if(fig.mode==='push'){go('final'); return;}
    I.pendingFinal=true; if(fig.mode!=='walk') resumePush();
  }
  switch(I.sub){
    case 'push': {
      const k=clamp(I.st/I.dur,0,1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      S.ct=I.from+(I.peak-I.from)*e+0.012*Math.sin(I.st*7.5); spring(7,1);
      if(I.st>=I.dur) setSub('struggle',rand(.6,1.1));
      break;}
    case 'struggle':
      S.ct=I.peak+0.008*Math.sin(I.st*11)-0.025*(I.st/I.dur); spring(14,1);
      if(I.st>=I.dur) startEpisode(pickEpisode());
      break;
    case 'slip': S.ct=I.low; spring(10,.42); if(I.st>=I.dur) setSub('regroup',.35); break;
    case 'regroup': S.ct=I.low; spring(10,.8); if(I.st>=I.dur) nextPush(); break;
    case 'backrest': // its back holds the word while it gets its breath; the word creeps back a little
      S.ct=I.hold-0.06*(I.st/I.dur); spring(5,1);
      if(I.st>=I.dur&&fig.mode==='act'){enterPush(fig.contact); nextPush();}
      break;
    case 'rest': S.ct=I.low; spring(4,.6); if(I.st>=I.dur&&fig.mode==='act') resumePush(); break;
    case 'wipe': S.ct=I.low; spring(3,1); if(I.st>=I.dur&&fig.mode==='act') resumePush(); break;
    case 'charge': S.ct=I.low; spring(4,.6); break;   // ends when the run-up hits the word
  }
}
function mirrorP(P,x0){const m=p=>[2*x0-p[0],p[1]]; return {hip:m(P.hip),sh:m(P.sh),hr:P.hr,neck:m(P.neck),head:m(P.head),mid:m(P.mid),legs:P.legs.map(l=>[m(l[0]),m(l[1])]),arms:P.arms.map(a=>[m(a[0]),m(a[1])])};}
function poseBackLean(cx,t){ // turned round, back against the word, legs braced out in front, breathing
  const u=Ly.u,g=Ly.ground,T=TORSO*u, br=Math.sin(t*3.2), lean=0.36+0.03*br;
  const shX=cx+(HR+2)*u, hipX=shX+T*Math.sin(lean), hipY=g-36*u+0.8*u*br;
  const hip=[hipX,hipY], P=upper(hip,lean,0,T);
  P.legs=[[hipX+22*u,g],[hipX+28*u,g]].map(f=>ik(hip,f,THIGH*u,SHIN*u,-1));
  P.arms=[[hipX+5*u,hipY-3*u],[hipX+8*u,hipY-1*u]].map(h=>ik(P.sh,h,UARM*u,FARM*u,1));
  return P;
}
function poseKnees(hipX,t){ // bent over, hands on knees, panting (built facing left)
  const u=Ly.u,g=Ly.ground,T=TORSO*u,pant=Math.sin(t*7);
  const hip=[hipX,g-38*u+pant*0.6*u], P=upper(hip,0.95+0.05*pant,1.5*u,T);
  P.legs=[[hipX-7*u,g],[hipX+5*u,g]].map(f=>ik(hip,f,THIGH*u,SHIN*u,1));
  P.arms=P.legs.map((l,i)=>ik(P.sh,[l[0][0]-1*u,l[0][1]-(i?1:2)*u],UARM*u,FARM*u,-1));
  return P;
}
function poseWipe(hipX,t){ // straightens up and wipes its brow
  const P=poseStand(hipX,-0.06,0,false,0), u=Ly.u, k=Math.sin(t*9);
  P.arms[0]=ik(P.sh,[P.head[0]-P.hr*0.3+k*3*u, P.head[1]-P.hr*0.1],UARM*u,FARM*u,-1);
  return P;
}
function updateAct(dt,cx){
  const A=fig.act, t=(A.t+=dt), c=Ly.capH, u=Ly.u;
  if(A.kind==='backrest') fig.P=poseBackLean(cx,t);
  else if(A.kind==='rest'){ // lets go, turns and trudges off a few steps, then doubles over
    if(t<1.1){const x=Math.max(cx+16*u,A.x0+(A.x1-A.x0)*ease(t/1.1)); fig.phase=(fig.phase+dt*1.2)%1; fig.P=mirrorP(poseStand(x,0.12,fig.phase,true,0),x);}
    else {if(!A.bent){A.bent=true; blendFrom(0.4);} fig.P=mirrorP(poseKnees(A.x1,t),A.x1);}
  }
  else if(A.kind==='wipe'){
    if(t<0.5){const x=A.x0+(A.x1-A.x0)*ease(t/0.5); fig.P=poseStand(x,0.05,0,false,0.2*(1-t/0.5));}
    else fig.P=poseWipe(A.x1,t);
  }
  else if(A.kind==='charge'){ // backs off, crouches, then runs at the word
    A.stage=A.stage||'away';
    if(A.stage==='away'){const k=Math.min(1,t/1.4), x=Math.max(cx+16*u,A.x0+(A.x1-A.x0)*ease(k)); fig.phase=(fig.phase+dt*1.3)%1; fig.P=mirrorP(poseStand(x,0.1,fig.phase,true,0),x); if(k>=1){A.stage='ready'; A.t0=t; blendFrom(0.3);}}
    else if(A.stage==='ready'){fig.P=poseStand(A.x1,0.3,0,false,0.45); if(t-A.t0>0.6){A.stage='run'; A.x=A.x1; fig.phase=0; blendFrom(0.15);}}
    else {
      const sp=c*3.4; A.x-=sp*dt; fig.phase=(fig.phase+sp*dt/(84*u))%1;
      fig.P=poseStand(A.x,0.32,fig.phase,true,0);
      if(A.x<=pushHipX(cx,0.32,0)){enterPush(cx); fig.effort=0.9; S.cv+=2.4; const I=S.ind; I.from=Math.min(.9,S.c+0.08); I.peak=Math.min(.9,S.c+rand(.35,.5)); setSub('push',rand(1,1.4));}
    }
  }
}

function step(dt){
  S.pt+=dt; S.fade=Math.min(1,S.fade+dt*4);
  switch(S.phase){
    case 'rest': S.ct=0; spring(10,1); if(S.pt>0.55) startApproach(); break;
    case 'approach': S.ct=0; break;
    case 'run': S.mode==='det'?runDet(dt):runInd(dt); break;
    case 'final': S.ct=1; spring(8,1); if(S.c>0.985) go('tension'); break;
    case 'tension': S.ct=1-0.004*(0.5+0.5*noise(T,6)); spring(30,1); if(S.pt>0.95) release(); break;
    case 'release': S.ct=0; if(S.pt>1.6&&Math.abs(S.c)<0.002&&Math.abs(S.cv)<0.02) go('done'); break;
    case 'done': S.ct=0; if(S.pt>2.8) replay(); break;   // loops on its own: no controls
  }
  const n=4,h=dt/n;
  for(let i=0;i<n;i++){const a=S.omega*S.omega*(S.ct-S.c)-2*S.zeta*S.omega*S.cv; S.cv+=a*h; S.c+=S.cv*h;}
  if(S.phase!=='release'&&S.phase!=='done'){ if(S.c>1){S.c=1;S.cv=0;} if(S.c<-0.06){S.c=-0.06;S.cv=0;} }

  let Jt=0;
  if(S.phase==='tension') Jt=1;
  else if(S.phase==='final'||(S.phase==='run'&&S.mode==='det')) Jt=smooth(0.8,1,S.c)*0.8;
  else if(S.phase==='run'&&S.ind.sub==='struggle') Jt=0.4;
  if(RM.matches) Jt=0;
  S.J+=(Jt-S.J)*Math.min(1,dt*5);
}

function updateFig(dt,G){
  const u=Ly.u, cx=G.rbR+G.rbx+Ly.stroke*0.6;
  fig.contact=cx;
  fig.t+=dt;
  switch(fig.mode){
    case 'stand':
      fig.lean+=(0.02-fig.lean)*Math.min(1,dt*4); fig.squash*=Math.exp(-dt*5);
      fig.P=poseStand(fig.hipX,fig.lean+0.025*Math.sin(fig.t*2.1),0,false,fig.squash+0.03*(1+Math.sin(fig.t*2.1))); break;
    case 'walk': {
      fig.lean+=(0.08-fig.lean)*Math.min(1,dt*4); fig.squash=0;
      const target=pushHipX(cx,0.08,0), dx=target-fig.hipX, sp=fig.walkSpeed;
      if(Math.abs(dx)<=sp*dt){
        fig.hipX=target;
        if(S.phase==='approach'){blendFrom(0.4); {const fr=pushFrame(cx,0.45,0.1); fig.feet=[[fr.hipX-20*u,Ly.ground],[fr.hipX+fr.reach*0.92,Ly.ground]];} fig.swing=null; fig.mode='push'; fig.effort=0; fig.prevContact=cx; go('run'); initRun();}
        else if(fig.resume){fig.resume=false; enterPush(cx); if(S.ind.pendingFinal){S.ind.pendingFinal=false; go('final');} else nextPush();}
        else fig.mode='stand';
      } else {fig.hipX+=Math.sign(dx)*sp*dt; fig.phase=(fig.phase+sp*dt/(84*u))%1;}
      fig.P=poseStand(fig.hipX,fig.lean,fig.phase,true,0); break;
    }
    case 'act': updateAct(dt,cx); break;
    case 'push': {
      let tE=0.4;
      if(S.phase==='tension'||S.phase==='release') tE=1;
      else if(S.phase==='final') tE=0.9;
      else if(S.phase==='run'){
        if(S.mode==='det') tE=0.3+0.7*clamp(S.c,0,1);
        else {const s=S.ind.sub; tE=s==='push'?0.45+0.5*clamp(S.c/0.72,0,1):s==='struggle'?0.95:s==='slip'?0.55:0.35;}
      }
      fig.effort+=(tE-fig.effort)*Math.min(1,dt*5);
      fig.lean+=((0.45+0.5*fig.effort)-fig.lean)*Math.min(1,dt*5);
      const vC=(cx-(fig.prevContact??cx))/Math.max(dt,1e-4); fig.prevContact=cx;
      let rate=0;
      if(vC<0) rate=0.3*(-vC)/Math.max(8*u,pushBack(fig.lean)+5*u);
      fig.adv+=(clamp(-vC/(Ly.capH*0.6),0,1)-fig.adv)*Math.min(1,dt*6);
      if(vC<=0.5){
        const scramble=(S.phase==='tension'||(S.phase==='run'&&S.mode==='ind'&&S.ind.sub==='struggle'))?0.3:0.12*fig.effort;
        rate+=scramble;
      }
      stepFeet(dt,cx);
      fig.P=posePush(cx,fig.lean,fig.effort,fig.feet);
      if(S.phase==='release') launch();
      break;
    }
    case 'fly': {
      const c=Ly.capH, t=fig.t;
      // horizontal: fast off the mark, easing to a steady glide; vertical: rises and levels off, then droops a touch
      fig.x=fig.x0+fig.vx*(t+0.12*(1-Math.exp(-t*8)));
      fig.y=fig.y0-fig.H*(1-Math.exp(-t*5.5))+c*0.35*Math.max(0,t-0.45)*Math.max(0,t-0.45)*2;
      const sp=smooth(0.1,0.55,t);                       // somersault progress, eased in and out
      fig.rot=fig.rot0+(0.3-fig.rot0)*smooth(0,0.12,t)+2*Math.PI*sp;
      const tuck=Math.sin(Math.PI*sp);                    // curls up while spinning, opens out after
      const base=localMix('recoil','fall',t/0.14,t);
      const L=tuck>0.01?lerpP(base,poseLocal('tuck',t),tuck):base;
      fig.P=place(L,fig.x,fig.y,fig.rot);
      const m=60*Ly.u;
      if(fig.x>Ly.vw+m||fig.y<-m||fig.y>Ly.vh+m){fig.mode='gone'; fig.P=null;}
      break;
    }
    case 'gone': fig.P=null; break;
    case 'hop': { // one small bounce, then slide
      const d=0.3, k=Math.min(fig.t/d,1);
      fig.x=fig.hx+Ly.capH*0.3*k; fig.y=lieY()-Ly.capH*0.35*Math.sin(Math.PI*k);
      fig.rot=Math.PI/2+0.25*Math.sin(Math.PI*k);
      fig.P=place(poseLocal('lie',0),fig.x,fig.y,fig.rot); pushTrail();
      if(k>=1){fig.mode='slide'; fig.vs=Ly.capH*1.6;}
      break;
    }
    case 'slide':
      fig.x+=fig.vs*dt; fig.vs=Math.max(0,fig.vs-Ly.capH*4*dt); fig.rot=Math.PI/2;
      fig.P=place(poseLocal('lie',0),fig.x,lieY(),fig.rot);
      if(fig.vs<=0) fig.mode='lie';
      break;
    case 'lie':
      fig.P=place(poseLocal('lie',0),fig.x,lieY(),Math.PI/2);
      break;
  }
  if(fig.bl<1&&fig.fromP){fig.bl=Math.min(1,fig.bl+dt/fig.blDur); fig.P=lerpP(fig.fromP,fig.P,ease(fig.bl));}
}

/* ---------- effort marks, dust, flight trail (from the motion reference) ---------- */
const fxG=$('fx'), trailEl=$('trail'), strainEl=$('strain'), motionEl=$('motion'), dustEl=$('dust');
/* line confetti for COMPLETE!: short strokes, zigzags, curls and waves that burst up and flutter down */
const confEl=$('confetti'); let confetti=[];
const SHAPES=['line','zig','curl','wave','line','curl'];
function burst(){
  const c=Ly.capH, x0=Ly.origin, x1=Ly.origin+(Ly.wid['COMPLETE!'].reduce((a,b)=>a+b)+8*Ly.track);
  confetti=[];
  for(let i=0;i<34;i++){
    const x=x0+(x1-x0)*Math.random();
    confetti.push({x, y:Ly.base-c*rand(.2,.9), vx:rand(-1.6,1.6)*c+(x-(x0+x1)/2)*0.9, vy:-rand(2.4,4.2)*c,
      rot:rand(0,6.28), vr:rand(-6,6), L:c*rand(.18,.34), kind:SHAPES[i%SHAPES.length], ph:rand(0,6.28), t:0, life:rand(2.2,3.2)});
  }
}
function drawConfetti(dt){
  if(!confetti.length){confEl.setAttribute('d',''); return;}
  const c=Ly.capH; let d='', alive=[];
  for(const q of confetti){
    q.t+=dt; if(q.t>q.life) continue; alive.push(q);
    q.vy+=c*5.5*dt; q.vx*=Math.exp(-1.6*dt); q.vy=Math.min(q.vy,c*1.4);   // light things: drag, slow terminal fall
    q.x+=q.vx*dt+Math.sin(q.t*6+q.ph)*c*0.35*dt; q.y+=q.vy*dt; q.rot+=q.vr*dt;
    const cs=Math.cos(q.rot), sn=Math.sin(q.rot), L=q.L*Math.min(1,(q.life-q.t)/0.6), P=(a,b)=>f2([q.x+a*cs-b*sn,q.y+a*sn+b*cs]);
    if(q.kind==='line') d+=`M${P(-L/2,0)} L${P(L/2,0)} `;
    else if(q.kind==='zig') d+=`M${P(-L/2,0)} L${P(-L/4,-L*.22)} L${P(0,0)} L${P(L/4,-L*.22)} L${P(L/2,0)} `;
    else if(q.kind==='curl') d+=`M${P(-L/2,0)} Q${P(0,-L*.7)} ${P(L/2,0)} `;
    else d+=`M${P(-L/2,0)} Q${P(-L/4,-L*.4)} ${P(0,0)} Q${P(L/4,L*.4)} ${P(L/2,0)} `;
  }
  confetti=alive;
  confEl.setAttribute('d',d);
}
function pushTrail(){
  const P=fig.P; if(!P) return;
  fig.trail.push([(P.hip[0]+P.sh[0])/2,(P.hip[1]+P.sh[1])/2,T]); if(fig.trail.length>90) fig.trail.shift();
  fig.trailA=1;
}
function drawFx(dt){
  const u=Ly.u, P=fig.P;
  fxG.setAttribute('stroke-width',(Ly.stroke*0.75).toFixed(2));
  // dashed arc behind a thrown figure, fading once it comes to rest
  if(!['fly','hop'].includes(fig.mode)) fig.trailA=Math.max(0,fig.trailA-dt*0.9);
  // only a short curved swoosh just behind the flying figure, not the whole path
  if(false){   // no motion trail
    const c=Ly.capH, vx=fig.vx, vy=fig.vy+fig.g*fig.t, n=Math.hypot(vx,vy)||1, dx=vx/n, dy=vy/n, px=-dy, py=dx;
    const h=P.hip, a=[h[0]-dx*0.55*c+px*0.25*c, h[1]-dy*0.55*c+py*0.25*c], b=[a[0]-dx*0.8*c, a[1]-dy*0.8*c];
    const m=[(a[0]+b[0])/2+px*0.12*c,(a[1]+b[1])/2+py*0.12*c];
    trailEl.setAttribute('d',`M${f2(a)} Q${f2(m)} ${f2(b)}`);
    trailEl.removeAttribute('stroke-dasharray');
    trailEl.setAttribute('opacity','0.7');
  } else trailEl.setAttribute('d','');
  let sd='', md='', dd='';
  if(fig.mode==='push'&&P){
    const h=P.head, r=P.hr;
    // strain: a small fan of ticks in front of the face (06 Strain)
    const sa=smooth(0.72,0.95,fig.effort);
    if(false){
      // sweat flicks off the back of the head (never on top of it)
      [-0.25,0.15,0.55].forEach((o,k)=>{
        const fl=0.6+0.4*Math.sin(T*13+k*2.1);
        const r1=r*1.35, r2=r1+(4+2*fl)*u*sa;
        sd+=`M${f2([h[0]+Math.cos(o)*r1,h[1]-Math.sin(o)*r1])} L${f2([h[0]+Math.cos(o)*r2,h[1]-Math.sin(o)*r2])} `;
      });
    }
    strainEl.setAttribute('opacity',sa.toFixed(3));
    // motion squiggles trailing behind the head while it gains ground (04 / 07)
    const ma=fig.adv;
    if(ma>0.02){
      [-3,3].forEach((dy,k)=>{
        const x0=h[0]+r*1.5+k*2*u, y0=h[1]+dy*u, w=(7+3*Math.sin(T*9+k))*u;
        md+=`M${f2([x0,y0])} q${(w/4).toFixed(2)} ${(-1.6*u).toFixed(2)} ${(w/2).toFixed(2)} 0 t${(w/2).toFixed(2)} 0 `;
      });
    }
    motionEl.setAttribute('opacity',Math.min(1,ma*1.6).toFixed(3));
    // grit kicked up behind the driving foot
    const da=smooth(0.55,0.9,fig.effort);
    if(da>0.01){
      const ft=P.legs[0][1][0]>P.legs[1][1][0]?P.legs[0][1]:P.legs[1][1], g=Ly.ground;
      const fl=0.5+0.5*Math.sin(T*17);
      dd=`M${f2([ft[0]+3*u,g-1.5*u])} L${f2([ft[0]+(6+2*fl)*u,g-(3+2*fl)*u])} M${f2([ft[0]+5*u,g-0.4*u])} L${f2([ft[0]+(9+2*fl)*u,g-1*u])}`;
    }
    dustEl.setAttribute('opacity',(da*0.8).toFixed(3));
  }
  strainEl.setAttribute('d',sd); motionEl.setAttribute('d',md); dustEl.setAttribute('d',dd);
  drawConfetti(dt);
}

/* ---------- colour: the screen heats to orange as the word is squeezed, turns green on release ---------- */
const PAL={calm:{bg:[7,28,3],fg:[226,233,220]},hot:{bg:[235,70,38],fg:[250,231,206]},done:{bg:[7,28,3],fg:[152,226,96]}};
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const hex=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
let lastCol='';
function applyColors(){
  let bg,fg;
  if(S.phase==='release'||S.phase==='done'){
    const k=S.phase==='done'?1:smooth(0,0.5,S.pt);
    const h=S.heat??1;
    const from={bg:mix(PAL.calm.bg,PAL.hot.bg,h),fg:mix(PAL.calm.fg,PAL.hot.fg,h)};
    bg=mix(from.bg,PAL.done.bg,k); fg=mix(from.fg,PAL.done.fg,k);
  } else {
    const h=smooth(0.3,0.95,clamp(S.c,0,1)); S.heat=h;
    bg=mix(PAL.calm.bg,PAL.hot.bg,h); fg=mix(PAL.calm.fg,PAL.hot.fg,h);
  }
  const key=hex(bg)+hex(fg);
  if(key!==lastCol){lastCol=key; const r=document.documentElement.style; r.setProperty('--bg',hex(bg)); r.setProperty('--fg',hex(fg));}
}

/* ---------- render ---------- */
function render(dt){
  const G=geom();
  const amp=S.J*Math.max(.5,Ly.capH*.016);
  const wx=amp*noise(T,1), wy=amp*.5*noise(T,2);
  G.rbx=amp*1.3*noise(T,3)+wx;
  updateFig(dt,G);

  applyColors();
  floorEl.setAttribute('x2',Math.max(Ly.lineR,G.rbL-Ly.rp+Ly.ext).toFixed(2));
  wordG.setAttribute('opacity',S.fade.toFixed(3));
  wordG.setAttribute('transform',`translate(${wx.toFixed(2)} ${wy.toFixed(2)})`);
  letters.forEach((el,i)=>{
    const L=G.letters[i]; if(!L) return;
    el.setAttribute('transform',`translate(${L.x.toFixed(2)} ${Ly.base.toFixed(2)}) scale(${Math.max(.001,L.s).toFixed(4)} 1)`);
    el.setAttribute('fill-opacity','1');
  });
  {const st=Ly.stroke, bw=Ly.capH*0.22, top=Ly.base-Ly.capH*1.06, bot=Ly.base+Ly.capH*0.06;
   const xl=G.ox+st/2, xr=G.rbR+G.rbx-st/2;
   lb.setAttribute('d',`M${(xl+bw).toFixed(2)} ${top.toFixed(2)} H${xl.toFixed(2)} V${bot.toFixed(2)} H${(xl+bw).toFixed(2)}`);
   rb.setAttribute('d',`M${(xr-bw).toFixed(2)} ${(top+wy).toFixed(2)} H${xr.toFixed(2)} V${(bot+wy).toFixed(2)} H${(xr-bw).toFixed(2)}`);}

  if(!fig.P){figG.setAttribute('visibility','hidden');}
  else{
    figG.setAttribute('visibility','visible');
    figG.setAttribute('opacity',S.phase==='rest'?S.fade.toFixed(3):'1');
    figG.setAttribute('transform',`translate(0 ${(amp*.6*noise(T,5)).toFixed(2)})`);
    drawFig(fig.P);
  }
  drawFx(dt);
  updateStatus();
}

/* ---------- UI ---------- */
let lastStatus='';
function updateStatus(){
  let s;
  if(S.mode==='det'){
    s={rest:'Ready',approach:'Approach',run:'Pushing',final:'Pushing',tension:'Hold',release:'Release',done:'Complete'}[S.phase];
  } else {
    s=S.phase==='run'?({push:'Pushing',struggle:'Straining',slip:'Losing ground',regroup:'Regrouping',backrest:'Leaning back',rest:'Catching breath',wipe:'Wiping brow',charge:'Run-up'}[S.ind.sub])
      :({rest:'Ready',approach:'Approach',final:'Final push',tension:'Hold',release:'Release',done:'Complete'}[S.phase]);
  }
  if(s!==lastStatus){statusEl.textContent=s; lastStatus=s;}
  const canComplete=S.mode==='ind'&&['rest','approach','run'].includes(S.phase)&&!S.completeReq;
  if(btnDone.disabled===canComplete) btnDone.disabled=!canComplete;
  const lock=['final','tension','release','done'].includes(S.phase);
  if(range.disabled!==lock) range.disabled=lock;
}
function syncSlider(){range.value=Math.round(S.prog); out.textContent=String(Math.round(S.prog)).padStart(3,'0')+'%';}

function replay(){
  setWord('LOADING');
  S.c=0;S.cv=0;S.ct=0;S.prog=0;S.auto=true;S.gen.seg=0;S.fade=0;S.completeReq=false;S.J=0;
  syncSlider(); go('rest');
  confetti=[]; fig.trail=[]; fig.trailA=0; fig.adv=0; fig.resume=false; fig.act=null; S.ind.pendingFinal=false;
  const G=geom(), restX=restHipX(G);
  if(fig.mode==='gone'||fig.mode==='fly'){ // it was thrown off screen: it walks back in from the right
    fig.mode='stand'; fig.hipX=restX; fig.lean=.02; fig.squash=0; fig.bl=1; fig.P=null;
  } else if(['lie','slide','hop'].includes(fig.mode)){ // get up where it landed, then walk back
    blendFrom(0.45); fig.mode='stand'; fig.hipX=fig.P?fig.P.hip[0]:restX; fig.lean=.02; fig.squash=0.6;
  } else if(fig.mode==='stand'&&fig.hipX>restX+1){ /* walks from where it stands */ }
  else {fig.mode='stand'; fig.hipX=restX; fig.lean=.02; fig.squash=0; fig.bl=1;}
  fig.prevContact=null;
}
function setMode(m){
  S.mode=m;
  btnDet.setAttribute('aria-pressed',m==='det'); btnInd.setAttribute('aria-pressed',m==='ind');
  btnDone.hidden=true;
  measure(); S.chain=chain(S.word);
  replay();
}
btnReplay.addEventListener('click',replay);
btnDet.addEventListener('click',()=>setMode('det'));
btnInd.addEventListener('click',()=>setMode('ind'));
btnDone.addEventListener('click',()=>{S.completeReq=true;});
// indeterminate never finishes by itself: click or tap anywhere to trigger completion
svg.addEventListener('click',()=>{ if(S.mode==='ind'&&['rest','approach','run'].includes(S.phase)) S.completeReq=true; });
range.addEventListener('input',()=>{
  if(!['rest','approach','run'].includes(S.phase)) return;
  S.auto=false; S.prog=+range.value; syncSlider();
});

function onResize(){
  measure(); S.chain=chain(S.word);
  if(S.phase==='rest'&&fig.mode==='stand') fig.hipX=restHipX(geom());
}
addEventListener('resize',onResize);

measure(); setWord('LOADING'); replay();
if(document.fonts&&document.fonts.load) document.fonts.load('300 64px "BenchNine"').then(()=>{onResize(); if(S.phase==='rest') replay();}).catch(()=>{});

let last=performance.now();
